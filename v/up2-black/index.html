  <!-- ── DELAY VTurb: revela .hide aos SECONDS_TO_DISPLAY do VÍDEO ── -->
  <script>
  (function () {
    var SECONDS_TO_DISPLAY = 235;                 // 03:55 (delay configurado na Atomicat p/ o Up02)
    var KEY = 'vturb_cta_6a2f4b91';               // persiste p/ quem já viu (não espera de novo)
    var MAX_WAIT_MS = 20000;                      // fail-safe: player não carregou

    // Espera o DOM: este script roda ANTES do bloco .hide existir,
    // entao revelar direto (caminho do localStorage) nao encontrava nada.
    function reveal() {
      function go() {
        document.querySelectorAll('.hide').forEach(function (e) { e.style.display = 'block'; });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
      else go();
    }

    try { if (localStorage.getItem(KEY)) { reveal(); return; } } catch (_) {}

    var waited = 0;
    var poll = setInterval(function () {
      var sp = window.smartplayer;
      if (sp && sp.instances && sp.instances[0]) {
        clearInterval(poll);
        sp.instances[0].on('timeupdate', function () {
          if (sp.instances[0].video.currentTime >= SECONDS_TO_DISPLAY) {
            reveal();
            try { localStorage.setItem(KEY, '1'); } catch (_) {}
          }
        });
        return;
      }
      // FAIL-SAFE: player nunca inicializou -> libera mesmo assim,
      // senão o comprador fica preso, sem aceitar nem recusar.
      waited += 200;
      if (waited >= MAX_WAIT_MS) { clearInterval(poll); reveal(); }
    }, 200);
  })();
  </script>
